<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Photography & Photoshop Study Quiz</title>

<style>
body{
font-family: Arial, sans-serif;
max-width:700px;
margin:40px auto;
text-align:center;
}

#prompt{font-size:18px;margin-bottom:10px;}
#question{font-size:26px;margin:20px 0;}

.choice{
border:1px solid #ccc;
padding:10px;
margin:8px 0;
border-radius:6px;
cursor:pointer;
font-size:18px;
}

.choice:hover{background:#f0f0f0;}

button{
margin-top:20px;
padding:10px 20px;
font-size:16px;
}
</style>

</head>
<body>

<h1>Photography & Photoshop Quiz</h1>

<div id="prompt"></div>
<div id="question"></div>
<div id="choices"></div>

<button onclick="nextQuestion()">Next</button>
<p id="progress"></p>

<script>

const questions=[

{prompt:"Choose the correct answer",
q:"What is the Rule of Thirds?",
a:"Dividing the frame into 9 equal parts and placing subjects on the lines",
choices:[
"Dividing the frame into 9 equal parts and placing subjects on the lines",
"Always putting the subject in the center",
"Using three cameras",
"Cropping a photo into thirds"
]},

{prompt:"Choose the correct answer",
q:"What are leading lines used for?",
a:"To guide the viewer's eye to the subject",
choices:[
"To guide the viewer's eye to the subject",
"To blur the background",
"To brighten photos",
"To change colors"
]},

{prompt:"Choose the correct answer",
q:"What does balancing elements mean?",
a:"Using objects to balance visual weight in a photo",
choices:[
"Using objects to balance visual weight in a photo",
"Taking photos perfectly centered",
"Making everything the same size",
"Removing all objects from the frame"
]},

{prompt:"Choose the correct answer",
q:"What does symmetry in photography mean?",
a:"Both sides of an image look similar or mirrored",
choices:[
"Both sides of an image look similar or mirrored",
"Using only circles",
"Only photographing buildings",
"Taking pictures upside down"
]},

{prompt:"Choose the correct answer",
q:"What is viewpoint?",
a:"The position or angle the photographer shoots from",
choices:[
"The position or angle the photographer shoots from",
"The brightness of a photo",
"The color temperature",
"The size of the lens"
]},

{prompt:"Choose the correct answer",
q:"Why is background important in photography?",
a:"A messy background can distract from the subject",
choices:[
"A messy background can distract from the subject",
"It changes camera batteries",
"It controls ISO",
"It sharpens the lens"
]},

{prompt:"Choose the correct answer",
q:"What does depth mean in photography?",
a:"Creating a sense of distance in the image",
choices:[
"Creating a sense of distance in the image",
"Taking underwater photos",
"Using the zoom tool",
"Changing exposure"
]},

{prompt:"Choose the correct answer",
q:"What is framing?",
a:"Using objects to surround or highlight a subject",
choices:[
"Using objects to surround or highlight a subject",
"Deleting part of a photo",
"Adding filters",
"Making photos square"
]},

{prompt:"Choose the correct answer",
q:"What does cropping do?",
a:"Removes unwanted parts of an image",
choices:[
"Removes unwanted parts of an image",
"Adds new objects",
"Changes ISO",
"Changes shutter speed"
]},

{prompt:"Choose the correct answer",
q:"Why is experimentation important in photography?",
a:"Trying different angles and ideas can improve photos",
choices:[
"Trying different angles and ideas can improve photos",
"It deletes bad photos",
"It fixes lighting automatically",
"It changes the camera lens"
]},

{prompt:"Choose the correct answer",
q:"What does ISO control?",
a:"The camera's sensitivity to light",
choices:[
"The camera's sensitivity to light",
"The lens zoom level",
"The camera battery",
"The file size"
]},

{prompt:"Choose the correct answer",
q:"What does aperture control?",
a:"How much light enters the camera lens",
choices:[
"How much light enters the camera lens",
"The color of the photo",
"The camera storage",
"The focus mode"
]},

{prompt:"Choose the correct answer",
q:"What is exposure?",
a:"The amount of light captured in a photo",
choices:[
"The amount of light captured in a photo",
"The camera brand",
"The focus distance",
"The background blur"
]},

{prompt:"Choose the correct answer",
q:"What does white balance adjust?",
a:"The color tone of lighting",
choices:[
"The color tone of lighting",
"The photo resolution",
"The camera battery",
"The zoom level"
]},

{prompt:"Choose the correct answer",
q:"What is a histogram?",
a:"A graph showing brightness levels in an image",
choices:[
"A graph showing brightness levels in an image",
"A lens type",
"A camera strap",
"A file format"
]},

{prompt:"Choose the correct answer",
q:"What is a RAW file?",
a:"An uncompressed image with full camera data",
choices:[
"An uncompressed image with full camera data",
"A blurry image",
"A small compressed photo",
"A screenshot"
]},

{prompt:"Choose the correct answer",
q:"What do adjustment layers do in Photoshop?",
a:"Allow edits without permanently changing the image",
choices:[
"Allow edits without permanently changing the image",
"Delete layers",
"Flatten images",
"Change camera settings"
]},

{prompt:"Choose the correct answer",
q:"What does the Healing Brush Tool do?",
a:"Removes blemishes or imperfections",
choices:[
"Removes blemishes or imperfections",
"Adds blur",
"Changes brightness",
"Rotates images"
]},

{prompt:"Choose the correct answer",
q:"What is the Clone Stamp tool used for?",
a:"Copying pixels from one area to another",
choices:[
"Copying pixels from one area to another",
"Adding color",
"Cropping images",
"Changing exposure"
]},

{prompt:"Choose the correct answer",
q:"What does the Dodge tool do?",
a:"Lightens parts of an image",
choices:[
"Lightens parts of an image",
"Darkens parts of an image",
"Blurs the image",
"Sharpens the image"
]},

{prompt:"Choose the correct answer",
q:"What does the Burn tool do?",
a:"Darkens parts of an image",
choices:[
"Darkens parts of an image",
"Brightens parts of an image",
"Deletes pixels",
"Sharpens edges"
]},

{prompt:"Choose the correct answer",
q:"What is a layer mask used for?",
a:"Hiding or revealing parts of a layer",
choices:[
"Hiding or revealing parts of a layer",
"Changing the lens",
"Cropping photos",
"Adjusting ISO"
]},

{prompt:"Choose the correct answer",
q:"What do blending modes do?",
a:"Change how layers interact with each other",
choices:[
"Change how layers interact with each other",
"Resize images",
"Delete backgrounds",
"Zoom images"
]},

{prompt:"Choose the correct answer",
q:"Why might a photographer convert a photo to black and white?",
a:"To focus on contrast, texture, and lighting",
choices:[
"To focus on contrast, texture, and lighting",
"To remove the subject",
"To reduce resolution",
"To increase file size"
]},

{prompt:"Choose the correct answer",
q:"What is an unedited photo?",
a:"A photo straight from the camera without changes",
choices:[
"A photo straight from the camera without changes",
"A photo with filters",
"A cropped image",
"A layered Photoshop file"
]}

];

function shuffle(arr){
return arr.sort(()=>Math.random()-0.5);
}

const quiz=shuffle(questions);

let index=0;
let score=0;
let answered=false;

function load(){
answered=false;
const item=quiz[index];

document.getElementById("prompt").textContent=item.prompt;
document.getElementById("question").textContent=item.q;
document.getElementById("progress").textContent=`Question ${index+1} of ${quiz.length}`;

const div=document.getElementById("choices");
div.innerHTML="";

const choices=shuffle(item.choices.slice());

choices.forEach(c=>{
const el=document.createElement("div");
el.className="choice";
el.textContent=c;
el.onclick=()=>select(c,el,item.a);
div.appendChild(el);
});
}

function select(choice,el,correctAnswer){
if(answered)return;
answered=true;

if(choice===correctAnswer){
score++;
el.style.background="#c8f7c5";
}else{
el.style.background="#f7c5c5";
const div=document.getElementById("choices");

Array.from(div.children).forEach(child=>{
if(child.textContent===correctAnswer){
child.style.background="#c8f7c5";
child.style.fontWeight="bold";
}
});
}
}

function nextQuestion(){
if(!answered)return;

index++;

if(index<quiz.length){
load();
}else{
document.body.innerHTML=`<h1>Quiz Complete</h1><h2>Your Score: ${score} / ${quiz.length}</h2>`;
}
}

load();

</script>

</body>
</html>
